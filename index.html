<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Rotina Pro</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0072ff">

<style>
:root { --cor-principal: #0072ff; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #121212;
  color: white;
}

header {
  background: #1f1f1f;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
}

.menu { cursor: pointer; font-size: 22px; }

.menu-box {
  display: none;
  position: absolute;
  right: 10px;
  top: 60px;
  background: #1e1e1e;
  padding: 15px;
  border-radius: 10px;
  width: 260px;
  z-index: 10;
}

.menu-box input,
.menu-box select {
  width: 100%;
  margin-bottom: 10px;
  padding: 8px;
  border-radius: 6px;
  border: none;
}

.container { padding: 20px; }

.progress-container {
  background: #2a2a2a;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 20px;
  height: 20px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: var(--cor-principal);
  transition: width 0.3s ease;
}

.task {
  background: #1e1e1e;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button {
  background: var(--cor-principal);
  border: none;
  color: white;
  padding: 6px 10px;
  border-radius: 6px;
  margin-top: 5px;
}

h3 { margin-top: 30px; }
</style>
</head>

<body>
	

<header>
<span id="titulo"></span>
<span class="menu" onclick="toggleMenu()">⋮</span>
</header>

<div class="menu-box" id="menuBox">

<label>Editar dia da semana:</label>
<select id="diaEditar" onchange="carregarDiaEdicao()"></select>

<label>Nova tarefa para esse dia:</label>
<input type="text" id="novaTarefaDia">
<button onclick="addTarefaDia()">Adicionar</button>

<label>Cor do tema:</label>
<input type="color" onchange="mudarCor(this.value)">

</div>

<div class="container">

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>

<div id="taskList"></div>

<h3>Histórico</h3>
<div id="historico"></div>

</div>

<script>

const diasNome = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta"];

let hoje = new Date();
let diaSemana = hoje.getDay();
if(diaSemana > 5) diaSemana = 0;

function formatarData(date){
  return date.toISOString().split("T")[0];
}

function chaveRotina(dia){ return "rotina_base_" + dia; }
function chaveProgresso(date){ return "progresso_" + formatarData(date); }

function carregarRotina(dia){
  return JSON.parse(localStorage.getItem(chaveRotina(dia))) || [];
}

function salvarRotina(dia,tarefas){
  localStorage.setItem(chaveRotina(dia),JSON.stringify(tarefas));
}

function carregarProgresso(date){
  return JSON.parse(localStorage.getItem(chaveProgresso(date))) || {};
}

function salvarProgresso(date,prog){
  localStorage.setItem(chaveProgresso(date),JSON.stringify(prog));
}

function atualizarTitulo(){
  document.getElementById("titulo").innerText =
  "Rotina de " + diasNome[diaSemana];
}

function atualizarProgresso(){
  let tarefas = carregarRotina(diaSemana);
  let prog = carregarProgresso(hoje);
  let total = tarefas.length;
  let feitas = Object.values(prog).filter(v=>v).length;
  let porcentagem = total? (feitas/total)*100:0;
  document.getElementById("progressBar").style.width=porcentagem+"%";
}

function render(){
  atualizarTitulo();
  const lista=document.getElementById("taskList");
  lista.innerHTML="";

  let tarefas=carregarRotina(diaSemana);
  let prog=carregarProgresso(hoje);

  tarefas.forEach((t,index)=>{
    const div=document.createElement("div");
    div.className="task";
    div.innerHTML=`
      <div>
        <input type="checkbox" ${prog[index]?"checked":""}
        onchange="toggle(${index})">
        <span onclick="editarTarefa(${index})">${t}</span>
      </div>
      <button onclick="removerTarefa(${index})">X</button>
    `;
    lista.appendChild(div);
  });

  atualizarProgresso();
  renderHistorico();
}

function toggle(index){
  let prog=carregarProgresso(hoje);
  prog[index]=!prog[index];
  salvarProgresso(hoje,prog);
  atualizarProgresso();
}

function editarTarefa(index){
  let tarefas=carregarRotina(diaSemana);
  let nova=prompt("Editar tarefa:",tarefas[index]);
  if(nova){
    tarefas[index]=nova;
    salvarRotina(diaSemana,tarefas);
    render();
  }
}

function removerTarefa(index){
  let tarefas=carregarRotina(diaSemana);
  tarefas.splice(index,1);
  salvarRotina(diaSemana,tarefas);
  render();
}

function addTarefaDia(){
  let input=document.getElementById("novaTarefaDia");
  let dia=document.getElementById("diaEditar").value;
  if(input.value.trim()!=""){
    let tarefas=carregarRotina(dia);
    tarefas.push(input.value);
    salvarRotina(dia,tarefas);
    input.value="";
    if(dia==diaSemana) render();
  }
}

function carregarDiaEdicao(){
  document.getElementById("novaTarefaDia").value="";
}

function mudarCor(cor){
  document.documentElement.style.setProperty('--cor-principal',cor);
  localStorage.setItem("corTema",cor);
}

function toggleMenu(){
  let box=document.getElementById("menuBox");
  box.style.display=box.style.display=="block"?"none":"block";
}

function renderHistorico(){
  const hist=document.getElementById("historico");
  hist.innerHTML="";
  for(let i=0;i<localStorage.length;i++){
    let key=localStorage.key(i);
    if(key.startsWith("progresso_")){
      let data=key.replace("progresso_","");
      let div=document.createElement("div");
      div.innerText=data;
      hist.appendChild(div);
    }
  }
}

function iniciar(){
  atualizarTitulo();

  const select=document.getElementById("diaEditar");
  diasNome.forEach((nome,index)=>{
    let option=document.createElement("option");
    option.value=index;
    option.textContent=nome;
    select.appendChild(option);
  });

  let corSalva=localStorage.getItem("corTema");
  if(corSalva){
    document.documentElement.style.setProperty('--cor-principal',corSalva);
  }

  render();
}

iniciar();

</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>
</body>
</html>
